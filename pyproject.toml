[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dphase"
version = "0.1.0"
description = "Phase-space Boltzmann solver for dark photon dark matter"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Charlotte Myers", email = "c_myers@mit.edu" },
]
keywords = ["dark matter", "dark photon", "boltzmann equation", "relic abundance", "cosmology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# Uncomment once a LICENSE file exists in the project root. Recent setuptools
# deprecates the { file = ... } table form in favour of an SPDX string, so use:
#     license = "MIT"
#     license-files = ["LICENSE"]
# which needs setuptools >= 77 (bump the build-system requirement to match).

dependencies = [
    # np.trapezoid (state.py) is NumPy >= 2.0 only; the older np.trapz alias
    # is deprecated. numba must be new enough to accept NumPy 2.x -- numba
    # < 0.61 hard-errors at import against NumPy 2.1+.
    "numpy>=2.0",
    "scipy>=1.11",
    "numba>=0.61",
    "mpmath>=1.3",     # cbe.py, for zeta(3)
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
    "jupyter",
    "ipykernel",       # needed to register the venv as a Jupyter kernel
]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/charlottemyers/dphase"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The tabulated g_*(T) must ship with the package; cosmology.gstar_interp
# loads it from dphase/data/ via the installed package directory.
dphase = ["data/*.dat"]
