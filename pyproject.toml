[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dphase"
version = "0.1.0"
description = "Phase-space Boltzmann solver for dark photon dark matter"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Charlotte Myers", email = "c_myers@mit.edu" },
]
keywords = ["dark matter", "dark photon", "boltzmann equation", "relic abundance", "cosmology"]


dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "numba>=0.61",
    "mpmath>=1.3",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
    "jupyter",
    "ipykernel",
]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/charlottemyers/DPhase"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dphase = ["data/*.dat"]
